<evt-panel [showSecondaryContent]="isSecondaryContentShown()" 
           (scrollContent)="updatePageFromScroll$.next()" 
           (click)="onPanelClicked($event)">
    <div header-left class="no-drag d-flex align-items-center">
        <evt-button
            ariaLabel="{{ 'ariaLabels.openInfoTab' | translate }}"
            aria-role="button"
            label="Info"
            [iconLeft]="{icon: 'info-circle', additionalClasses: 'me-1'}"
            additionalClasses="btn-primary me-1"
            (btnClick)="toggleSecondaryContent('info')"
            [active]="secondaryContent === 'info'"></evt-button>
        <evt-edition-selector></evt-edition-selector>
        <evt-page-selector [pageID]="pageID" (selectionChange)="updatePage$.next($event)"></evt-page-selector>
        <evt-edition-level-selector [class.hidden]="hideEditionLevelSelector" [editionLevelID]="editionLevelID" (selectionChange)="onUserEditionLevel($event)"></evt-edition-level-selector>
        <evt-change-layer-selector [class.hidden]="!(showChangeLayerSelector)" [selLayer]="selLayer" (layerChange)="updateSelectedLayer($event)"></evt-change-layer-selector>
    </div>
    <div content evtAnnotator #mainContent>
        <ng-container *ngIf="(currentStatus$ | async) as currentStatus">
            <ng-container *ngIf="isMultiplePageFlow$ | async">
                <evt-page *ngFor="let page of currentStatus.pages"
                    [attr.data-id]="page.id"
                    [data]="page"
                    [textFlow]="textFlow"
                    [withDeletions]="showDeletions"
                    [selectedLayer]="selectedLayer"
                    [itemsToHighlight]="itemsToHighlight$ | async"></evt-page>
            </ng-container>
            <evt-page *ngIf="(isMultiplePageFlow$ | async) === false"
                [attr.data-id]="currentStatus.currentPage.id"
                [data]="currentStatus.currentPage"
                [editionLevel]="currentStatus.editionLevel"
                [textFlow]="textFlow"
                [withDeletions]="showDeletions"
                [selectedLayer]="selectedLayer"
                [itemsToHighlight]="itemsToHighlight$ | async"></evt-page>
        </ng-container>
    </div>
    <div secondary-content>
        <ng-container [ngSwitch]="secondaryContent">

            <ng-container *ngSwitchCase="'info'">
                <!-- [Autos] Nella scheda Info mostriamo SOLO la legenda delle fasi/strati.
                     Il contenuto <front> (che per questa edizione contiene la bibliografia)
                     NON va reso qui: la bibliografia ha la sua sede in "Project Info" ->
                     "Bibliografia". Renderlo qui faceva comparire la bibliografia tutta di
                     seguito alla PRIMA apertura della scheda, salvo sparire dopo un reload,
                     per via di quando veniva valutato parsedFront. -->

                <!-- [Autos] Legenda delle fasi/strati di scrittura (colori della vista "changes"). -->
                <div class="phase-legend" *ngIf="phaseLegend.length > 0">
                    <h3 class="phase-legend-title">Fasi e strati di scrittura</h3>
                    <ul class="phase-legend-list">
                        <li *ngFor="let ph of phaseLegend" class="phase-legend-item">
                            <span class="phase-legend-swatch" [style.background-color]="ph.color"></span>
                            <span class="phase-legend-label">{{ ph.label }}</span>
                            <span class="phase-legend-pages" *ngIf="layerPages[ph.id]?.length">{{ layerPages[ph.id].join(', ') }}</span>
                            <span class="phase-legend-pages phase-legend-pages--empty" *ngIf="!layerPages[ph.id]?.length">&mdash;</span>
                        </li>
                    </ul>
                </div>
            </ng-container>

            <ng-container *ngSwitchCase="'search'">
                Search results
            </ng-container>

            <ng-container *ngSwitchDefault>
                Unsupported content
            </ng-container>

            </ng-container>
    </div>

    <div footer class="d-flex align-items-center" >
        <evt-button
            ariaLabel="{{ 'ariaLabels.searchResult' | translate }}"
            aria-role="button"
            [iconLeft]="{icon: 'search'}"
            label="Search"
            additionalClasses="me-1"
            (btnClick)="toggleSecondaryContent('search')"
            [active]="secondaryContent === 'search'">
        </evt-button>
        <evt-entities-select (selectionChange)="itemsToHighlight$.next($event)"></evt-entities-select>
        <evt-verse-prose-select *ngIf="enableProseVersesToggler" (textModeSelectionChange)="toggleProseVerses($event)"></evt-verse-prose-select>
        <evt-button *ngIf="enableHideDeletionsToggler"
            ariaLabel="{{ 'ariaLabels.hideDeletionsFromText' | translate }}"
            aria-role="button"
            [iconLeft]="hideDeletionsTogglerIcon"
            [label]="'showsDeletions' | translate "
            [active]="showDeletions"
            additionalClasses="ms-1"
            (btnClick)="toggleHideDeletions()">
        </evt-button>
    </div>
</evt-panel>
